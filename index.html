<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="theme-color" content="#F6DDB0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Geo Hunt">
    <title>Geo Hunt</title>
    <link rel="icon" type="image/svg+xml" href="TemplateData/pin.svg">
    <link rel="apple-touch-icon" href="TemplateData/icon-180.png">
    <link rel="manifest" href="TemplateData/manifest.json">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="gh-stage">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="gh-loader">
        <div class="gh-center">
          <img class="gh-pin" src="TemplateData/pin.svg" alt="">
          <div class="gh-pin-shadow"></div>
          <div class="gh-title">Geo Hunt</div>
          <div class="gh-subtitle">جيو هنت</div>
          <div class="gh-bar"><div class="gh-bar-fill" id="gh-bar-fill"></div></div>
          <div class="gh-status" id="gh-status"></div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var arabic = /^ar\b/i.test(navigator.language || "");
        var text = arabic
          ? { loading: "جار التحميل…", starting: "لحظات ونبدأ…", noWebGL: "متصفحك لا يدعم تشغيل اللعبة. جرب Safari أو Chrome بإصدار حديث.", failed: "تعذر تحميل اللعبة. تحقق من الاتصال ثم أعد تحميل الصفحة." }
          : { loading: "Loading…", starting: "Almost there…", noWebGL: "This browser can't run the game. Try an up-to-date Safari or Chrome.", failed: "The game couldn't load. Check your connection and reload the page." };
        var status = document.getElementById("gh-status");
        var fill = document.getElementById("gh-bar-fill");
        var loader = document.getElementById("gh-loader");
        if (arabic) { status.dir = "rtl"; }
        status.textContent = text.loading;

        // Never let the page scroll, bounce or zoom under the game.
        document.addEventListener("touchmove", function (e) { if (e.target && e.target.id === "unity-canvas") e.preventDefault(); }, { passive: false });
        document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
        document.addEventListener("dblclick", function (e) { e.preventDefault(); });

        function fail(message) {
          loader.classList.add("gh-error");
          status.textContent = message;
        }

        var canvas = document.getElementById("unity-canvas");
        var config = {
          arguments: [],
          dataUrl: "Build/WebGL.data.unityweb",
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "Geo Hunt",
          productVersion: "0.1.0",
          // Phones have 3x screens: drawing at 2x looks the same and runs much faster.
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner: function (message, type) {
            if (type === "error") fail(message);
            else console.warn(message);
          }
        };

        var probe = document.createElement("canvas");
        if (!(probe.getContext("webgl2") || probe.getContext("webgl"))) { fail(text.noWebGL); return; }

        var script = document.createElement("script");
        script.src = "Build/WebGL.loader.js";
        script.onload = function () {
          createUnityInstance(canvas, config, function (progress) {
            fill.style.width = Math.round(100 * Math.max(0.04, progress)) + "%";
            if (progress >= 0.999) status.textContent = text.starting;
          }).then(function (instance) {
            window.geoHuntInstance = instance;
            // The game hides the loading screen itself once the main menu is up (GeoHunt_HideLoader); this is only a safety net.
            setTimeout(function () { loader.classList.add("gh-hidden"); }, 30000);
          }).catch(function (message) {
            console.error(message);
            fail(text.failed);
          });
        };
        script.onerror = function () { fail(text.failed); };
        document.body.appendChild(script);
      })();
    </script>
  </body>
</html>
